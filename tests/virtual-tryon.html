<!doctype html><meta charset="utf-8"><title>추천 가상 입어보기 검사</title>
<link rel="stylesheet" href="/css/styles.css"><div id="root"></div><pre id="result">RUNNING</pre>

function colorCounts(canvas){const rgba=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data,counts={red:0,blue:0,yellow:0};for(let i=0;i<rgba.length;i+=4){if(rgba[i+3]<250)continue;if(rgba[i]>180&&rgba[i+1]<70&&rgba[i+2]<70)counts.red++;if(rgba[i+2]>180&&rgba[i]<70&&rgba[i+1]<70)counts.blue++;if(rgba[i]>180&&rgba[i+1]>180&&rgba[i+2]<70)counts.yellow++;}return counts;}
function referenceMatch(actual,reference){const a=actual.getContext('2d').getImageData(0,0,640,480).data,b=reference.getContext('2d').getImageData(0,0,640,480).data;let checked=0,matched=0;for(let i=0;i<b.length;i+=4)if(b[i+3]>=250){checked++;if(Math.abs(a[i]-b[i])<4&&Math.abs(a[i+1]-b[i+1])<4&&Math.abs(a[i+2]-b[i+2])<4)matched++;}return checked>100&&matched/checked>.99;}

try{
 window.fetch=fetchMock;

 controller=openVirtualTryOn(records,{visionLoader:loader});dialog=controller.dialog;
 await wait(()=>!dialog.querySelector('[data-start]').disabled);

 navigator.mediaDevices.getUserMedia=async()=>{
   const camera=document.createElement('canvas');camera.width=640;camera.height=480;const c=camera.getContext('2d');let t=0;sourceTimer=setInterval(()=>{c.fillStyle=t++%2?'#709080':'#809070';c.fillRect(0,0,640,480);},50);
   const stream=camera.captureStream(20);streams.push(stream);return stream;
 };

 check(range.value==='1','상하의 조절값 분리');
 const originalClick=HTMLAnchorElement.prototype.click;let downloaded;
 HTMLAnchorElement.prototype.click=function(){downloaded={url:this.href,name:this.download};};dialog.querySelector('[data-capture]').click();HTMLAnchorElement.prototype.click=originalClick;

 // Compare the final composite with the whole transparent texture. Checking only
 // any red pixel would miss a disappearing left or right sleeve.

   {sleeve:'반팔',category:2,label:'반팔·손목 미인식'},
   {sleeve:'긴팔',category:2,label:'긴팔·손목 미인식'},
   {sleeve:'반팔',category:3,label:'얼굴 오분류 가능 모델'},
   {sleeve:'긴팔',category:1,label:'머리카락 오분류 가능 모델'},
 ]){
   records[0].sleeveLength=test.sleeve;maskCategory=test.category;
   cameraPoints=changedArms;
   controller=openVirtualTryOn([records[0]],{visionLoader:loader});dialog=controller.dialog;
   await wait(()=>!dialog.querySelector('[data-start]').disabled);
   const before=detects;dialog.querySelector('[data-start]').click();await wait(()=>detects>=before+2);
   const finalCanvas=dialog.querySelector('canvas');
   const colors=colorCounts(finalCanvas),reference=document.createElement('canvas');reference.width=640;reference.height=480;
   drawTop(reference.getContext('2d'),prepareTexture(records[0],image),changedArms,640,480,{fit:1});
   check(colors.blue>100,test.label+'에서 왼쪽 파란 소매 원본 보존');
   check(colors.yellow>100,test.label+'에서 오른쪽 노란 소매 원본 보존');
   check(referenceMatch(finalCanvas,reference),test.label+'에서 최종 합성된 옷 전체가 원본 표시와 일치');
   check(segmentCalls===0,test.label+'에서도 사람 분할 모델 미사용');

     const beforeMove=detects;cameraPoints=points;await wait(()=>detects>=beforeMove+3);
     check(referenceMatch(finalCanvas,reference),'카메라 실행 중 팔을 움직여도 옷 전체 실루엣과 색상 유지');

       for(const [key,value]of [['x',x],['y',y]]){const slider=dialog.querySelector('[data-adjust='+key+']');slider.value=value;slider.dispatchEvent(new Event('input'));}
       const beforeOffset=detects;await wait(()=>detects>=beforeOffset+2);
       reference.getContext('2d').clearRect(0,0,640,480);drawTop(reference.getContext('2d'),prepareTexture(records[0],image),points,640,480,{fit:1,x,y});
       check(referenceMatch(finalCanvas,reference),'위치 조절 '+x+'/'+y+'가 최종 합성에서 한 번만 적용');
       const offsetColors=colorCounts(finalCanvas);check(offsetColors.blue>100&&offsetColors.yellow>100,'위치 조절 후에도 양쪽 소매 전체 유지');
     }
     for(const key of ['x','y']){const slider=dialog.querySelector('[data-adjust='+key+']');slider.value=0;slider.dispatchEvent(new Event('input'));}
     cameraPoints=points.map((p,i)=>i===11?{...p,x:NaN}:p);const beforeLost=detects;await wait(()=>detects>=beforeLost+2);
     const lostColors=colorCounts(finalCanvas);check(lostColors.blue===0&&lostColors.yellow===0&&lostColors.red===0,'어깨 좌표가 잘못되면 해당 옷을 안전하게 숨김');

     reference.getContext('2d').clearRect(0,0,640,480);drawTop(reference.getContext('2d'),prepareTexture(records[0],image),points,640,480,{fit:1});
     check(referenceMatch(finalCanvas,reference),'잘못된 어깨 좌표 뒤 정상 인식되면 옷 전체 복구');

 controller=openVirtualTryOn([records[0]],{visionLoader:loader});dialog=controller.dialog;await wait(()=>!dialog.querySelector('[data-start]').disabled);dialog.querySelector('[data-start]').click();await wait(()=>dialog.querySelector('[data-status]').textContent.includes('권한'));
 check(!dialog.querySelector('[data-start]').disabled,'권한 거부 안내와 재시도');controller.close();navigator.mediaDevices.getUserMedia=old;
 let resolveVision;controller=openVirtualTryOn([records[0]],{visionLoader:()=>new Promise(resolve=>{resolveVision=resolve;})});dialog=controller.dialog;await wait(()=>!dialog.querySelector('[data-start]').disabled);dialog.querySelector('[data-start]').click();controller.close();const closedBefore=poseClosed;resolveVision(await loader());await new Promise(resolve=>setTimeout(resolve,20));check(poseClosed===closedBefore+1,'닫은 뒤 완료된 모델도 해제');
 let resolveCamera;navigator.mediaDevices.getUserMedia=()=>new Promise(resolve=>{resolveCamera=resolve;});controller=openVirtualTryOn([records[0]],{visionLoader:loader});dialog=controller.dialog;await wait(()=>!dialog.querySelector('[data-start]').disabled);dialog.querySelector('[data-start]').click();await wait(()=>resolveCamera);controller.close();const late=image.captureStream(0);resolveCamera(late);await new Promise(resolve=>setTimeout(resolve,20));check(late.getTracks().every(track=>track.readyState==='ended'),'닫힌 뒤 허용된 카메라 스트림도 즉시 종료');navigator.mediaDevices.getUserMedia=old;
 controller=openVirtualTryOn([records[0]],{visionLoader:async()=>{throw Error('model failure');}});dialog=controller.dialog;await wait(()=>!dialog.querySelector('[data-start]').disabled);dialog.querySelector('[data-start]').click();await wait(()=>dialog.querySelector('[data-status]').textContent.includes('모델 또는'));check(!dialog.querySelector('[data-start]').disabled,'모델 실패 후 재시도');controller.close();
 window.fetch=async()=>json({error:'deleted'},404);controller=openVirtualTryOn([records[0]],{visionLoader:loader});dialog=controller.dialog;await wait(()=>dialog.querySelector('[data-status]').textContent.includes('삭제'));check(dialog.querySelector('[data-start]').disabled,'삭제된 추천 옷은 입어보기 차단');controller.close();
 window.fetch=fetchMock;const root=document.querySelector('#root');await renderRecommendation(root,{activeTab:'recommendation'});root.querySelector('[data-filter=size]').value='140';root.querySelector('[data-filter=size]').dispatchEvent(new Event('change'));

}catch(error){document.querySelector('#result').textContent='FAIL '+error.stack;}
finally{closeVirtualTryOn();clearInterval(sourceTimer);streams.forEach(s=>s.getTracks().forEach(t=>t.stop()));window.fetch=originalFetch;navigator.mediaDevices.getUserMedia=originalMedia;}
